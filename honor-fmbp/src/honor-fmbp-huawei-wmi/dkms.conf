PACKAGE_NAME="honor-fmbp-huawei-wmi"
PACKAGE_VERSION="7.0.1"
BUILT_MODULE_NAME[0]="huawei-wmi"
DEST_MODULE_LOCATION[0]="/updates/dkms"
MAKE[0]="make KVER=$kernelver"
CLEAN="make KVER=$kernelver clean"
AUTOINSTALL="yes"
# huawei-wmi.c is mainline v7.0 + fmbp-keymap.patch and REPLACES the in-tree driver.
# Only build it for the kernel series it was taken from: on any other kernel dkms
# skips it and the in-tree driver (with whatever fixes it gained) stays in charge.
BUILD_EXCLUSIVE_KERNEL="^7\.0\."
