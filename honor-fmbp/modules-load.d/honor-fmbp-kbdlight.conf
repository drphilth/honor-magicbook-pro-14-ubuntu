# HONOR MagicBook Pro 14 (FMB-P) keyboard-backlight driver.
# Since 1.0.6 the module carries a DMI modalias, so udev should autoload it on
# the FMB-P by itself. This explicit load stays until that is confirmed on
# hardware (the 1.0.5 fix); elsewhere the module just declines with -ENODEV.
honor-fmbp-kbdlight
