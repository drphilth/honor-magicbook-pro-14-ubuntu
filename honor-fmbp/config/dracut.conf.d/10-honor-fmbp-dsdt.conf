# HONOR MagicBook Pro 14 (FMB-P) — boot-critical DSDT override, dracut side.
#
# On dracut systems the package's initramfs-tools hook is inert, so this drop-in
# drives the same early-cpio ACPI table upgrade. honor-fmbp-dsdt-select keeps
# /usr/share/honor-fmbp/acpi/ holding exactly the corrected AML for this
# machine's SKU (global vs Chinese); dracut packs every *.aml found there into an
# uncompressed early cpio at kernel/firmware/acpi/, which the kernel applies via
# CONFIG_ACPI_TABLE_UPGRADE before it parses the firmware DSDT. When no SKU is
# selected (not an FMB-P, or an unrecognised BIOS) the directory is absent and
# dracut's acpi_override guard adds nothing.
acpi_override="yes"
acpi_table_dir="/usr/share/honor-fmbp/acpi"
